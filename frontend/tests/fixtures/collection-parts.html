<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8" />
<title>合集与分 P 布局验证</title>
<div id="app"></div>
<script type="module">
import { createApp, h } from 'vue'
import CollectionSelectorModal from '../../src/components/CollectionSelectorModal.vue'
import '../../src/styles/main.css'
const params = new URL(location.href).searchParams
const count = Number(params.get('parts') || 100)
document.documentElement.dataset.theme = params.get('theme') || 'light'
const episodes = Array.from({ length: 18 }, (_, i) => ({
  index: i + 1, page: 1, cid: (i + 1) * 1000, bvid: `BVfixture${i}`, aid: i + 1,
  title: i === 0 ? '第一册：从识谱到完整演奏——包含基础讲解、分段练习与完整示范的钢琴课程' : `第${i + 1}册：钢琴教学与分段练习`,
  durationStr: '36:34',
}))
window.go = { main: { App: {
  GetPlaybackInfo: async () => ({ qualities: [{ id: 80, label: '1080P 高清', isAvailable: true }] }),
  GetCollectionVideoParts: async (ep) => ({ index: ep.index, bvid: ep.bvid, title: ep.title,
    parts: Array.from({ length: ep.index === 1 ? count : [1,2,3,12][ep.index % 4] }, (_, i) => ({
      ...ep, cid: ep.index * 1000 + i, page: i + 1, durationStr: '12:35',
      title: i % 3 === 0 ? `第${i + 1}课：双手配合与节奏练习——先分手慢练，再合手演奏，掌握完整的乐句与力度变化` : `第${i + 1}课：音阶练习与分段示范`,
    })),
  }),
} } }
window.qa = { submitted: [] }
createApp({ render: () => h(CollectionSelectorModal, {
  detail: { type: 'normal', collectionId: 1, collectionTitle: '钢琴课程 · 合集布局验证', title: '钢琴课程', episodes, totalParts: episodes.length, hasLinkedEpisode: true, defaultPage: 1 },
  initialQuality: 'highest', initialCodec: 'auto',
  onSubmit: (cids) => { window.qa.submitted = cids },
}) }).mount('#app')
</script>
</html>
