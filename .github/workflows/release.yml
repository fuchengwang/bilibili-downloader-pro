name: Build & Publish Release

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: 'frontend/pnpm-lock.yaml'

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install NSIS
        run: choco install nsis -y

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: pnpm install --frozen-lockfile

      - name: Download Standalone Static FFmpeg for Windows
        shell: bash
        run: |
          mkdir -p build/bin
          curl -L -o build/bin/ffmpeg.exe https://github.com/eugeneware/ffmpeg-static/releases/download/b6.0/ffmpeg-win32-x64

      - name: Build Windows Application (Installer & Binaries)
        run: wails build -platform windows/amd64 -nsis

      - name: Upload Windows Artifact to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        with:
          files: build/bin/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifacts (Fallback)
        uses: actions/upload-artifact@v4
        with:
          name: Bilibili-Downloader-Windows-x64
          path: build/bin/*

  build-macos-arm64:
    name: Build macOS (Apple Silicon arm64)
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: 'frontend/pnpm-lock.yaml'

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: pnpm install --frozen-lockfile

      - name: Download Standalone Static FFmpeg for macOS
        run: |
          mkdir -p build/bin
          curl -L -o build/bin/ffmpeg https://github.com/eugeneware/ffmpeg-static/releases/download/b6.0/ffmpeg-darwin-arm64
          chmod +x build/bin/ffmpeg

      - name: Build macOS Application
        run: wails build -platform darwin/arm64

      - name: Embed FFmpeg and Package macOS App
        run: |
          cd build/bin
          APP_NAME=$(ls -d *.app | head -n 1)
          if [ -n "$APP_NAME" ]; then
            mkdir -p "$APP_NAME/Contents/MacOS"
            cp -f ffmpeg "$APP_NAME/Contents/MacOS/ffmpeg"
            chmod +x "$APP_NAME/Contents/MacOS/ffmpeg"
            zip -r -y -q "Bilibili-Downloader-macOS-arm64.zip" "$APP_NAME"
            echo "Successfully packaged $APP_NAME with embedded FFmpeg into Bilibili-Downloader-macOS-arm64.zip"
          fi

      - name: Upload macOS Artifact to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        with:
          files: build/bin/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifacts (Fallback)
        uses: actions/upload-artifact@v4
        with:
          name: Bilibili-Downloader-macOS-arm64
          path: build/bin/*.zip
